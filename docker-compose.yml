services:

  api:
    build: .
    container_name: url_shortener_api

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

    volumes:
      - .:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  postgres:
    image: postgres:17

    container_name: url_shortener_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 18022005
      POSTGRES_DB: url_shortener

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest

    container_name: url_shortener_redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: